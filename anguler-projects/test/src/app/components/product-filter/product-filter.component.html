<div class="filter-container">
  <h3>Product Filter</h3>
  <div class="filter-options">
    <label>
      <input type="radio" name="filter" value="all" (change)="onFilterChange('all')" [checked]="selectedFilter === 'all'">
      All Products
    </label>
    <label>
      <input type="radio" name="filter" value="available" (change)="onFilterChange('available')" [checked]="selectedFilter === 'available'">
      Available Products
    </label>
    <label>
      <input type="radio" name="filter" value="unavailable" (change)="onFilterChange('unavailable')" [checked]="selectedFilter === 'unavailable'">
      Unavailable Products
    </label>
  </div>
</div>
